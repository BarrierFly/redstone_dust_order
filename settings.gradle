import groovy.json.JsonSlurper

pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'Jitpack'
			url = 'https://jitpack.io'
			content { includeGroupAndSubgroups('com.github') }
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

def settings = new JsonSlurper().parseText(file('settings.json').text)

settings.versions.each { String version ->
	include(":$version")

	def proj = project(":$version")
	proj.projectDir = file("versions/$version")
	proj.buildFileName = '../../common.gradle'
}

// Per-version mcVersion and api_era live in versions/<version>/gradle.properties,
// which Gradle reads into the project automatically. Listing them here as well
// would mean keeping two copies of the same table in sync.

logger.lifecycle("Development branch: :${settings.dev}")