# Gradle Properties
	org.gradle.jvmargs=-Xmx6G

# Fabric Basic Properties
	# https://fabricmc.net/versions.html
	loader_version=0.19.5

# Mod Properties
	mod_id=redstone_dust_order
	mod_name=Redstone Dust Update Order
	mod_version=0.1.0
	maven_group=dev.redstone_dust_order
	archives_base_name=redstone_dust_order

# Dependencies
	junit_version=5.10.2

# Toolchains
	# 26.x compiles at Java 25, the older branches at 17 or 21, none of which is
	# necessarily the JDK running Gradle. Point Gradle at the installs to search
	# so it can pick a toolchain without downloading one.
	# https://docs.gradle.org/current/userguide/toolchains.html#sub:installing_jdks
	org.gradle.java.installations.auto-download=false
	org.gradle.java.installations.auto-detect=true